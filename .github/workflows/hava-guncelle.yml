name: Hava Durumu Guncelle

on:
  schedule:
    - cron: '0 * * * *'  # Her saat başı çalışır
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: pip install requests

    - name: Hava Durumu Botunu Çalıştır
      run: python bot.py

    - name: Verileri GitHub'a Kaydet
      run: |
        git config --global user.name "Hava Durumu Botu"
        git config --global user.email "bot@inadinatv-hava.com"
        git add index.html
        git commit -m "☁️ Hava durumu güncellendi" || exit 0
        git push
